<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotion - M2 MOTORSPORT EVOLUTION</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* กำหนดตัวแปรสีหลักสไตล์ M2 Motorsport Evolution (Dark & Cyan Neon) */
        :root {
            --neon-cyan: #00f0ff;      /* สีฟ้าเทอร์คอยซ์นีออนเด่น */
            --neon-cyan-hover: #00b8c4;/* สีฟ้าเข้มตอนปุ่มถูกชี้ */
            --bg-dark: #0b0f19;        /* สีพื้นหลังมืดสนิทสไตล์แอป */
            --card-bg: #111827;        /* สีพื้นหลังการ์ด/กล่อง */
            --input-bg: #1f2937;       /* สีพื้นหลังช่องกรอกข้อมูล */
            --border-color: #1e3a4c;   /* สีเส้นขอบอมฟ้าเข้ม */
            --text-primary: #ffffff;   /* สีตัวอักษรหลัก */
            --text-secondary: #9ca3af; /* สีตัวอักษรรอง */
        }

        /* รีเซ็ตสไตล์เริ่มต้น */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: radial-gradient(circle at center, #111e30 0%, var(--bg-dark) 100%);
            color: var(--text-primary);
            font-family: 'Kanit', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* คอนเทนเนอร์หลัก */
        .container {
            width: 100%;
            max-width: 480px;
            margin: 40px auto;
        }

        /* โลโก้ MG สไตล์นีออนฟ้า M2 */
        .logo-badge {
            width: 75px;
            height: 75px;
            border: 2px solid var(--neon-cyan);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin: 0 auto 20px auto;
            color: var(--neon-cyan);
            background-color: var(--card-bg);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 10px rgba(0, 240, 255, 0.2);
            letter-spacing: -1px;
        }

        /* ส่วนหัวเรื่องหลัก */
        .header-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-section h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 8px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .header-section h1 span {
            color: var(--neon-cyan);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.5);
        }

        .header-section p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            font-weight: 300;
        }

        /* ตัวการ์ดฟอร์มลงทะเบียน */
        .promo-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 35px 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8), 0 0 15px rgba(0, 240, 255, 0.05);
            position: relative;
            overflow: hidden;
        }

        /* แถบแสงสีฟ้านีออนด้านบนสุดของการ์ด */
        .promo-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            box-shadow: 0 0 10px var(--neon-cyan);
        }

        .promo-card h2 {
            font-size: 1.3rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 25px;
            color: var(--text-primary);
        }

        /* สไตล์ฟิลด์แต่ละช่อง */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group label span {
            color: var(--neon-cyan);
        }

        /* ออกแบบ Input และ Select */
        input, select {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 1rem;
            font-family: 'Kanit', sans-serif;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        /* ปรับดีไซน์ Dropdown ให้เข้ากับธีมฟ้า */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%2300f0ff' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 40px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
            background-color: #172033;
        }

        input::placeholder {
            color: #4b5563;
        }

        /* สไตล์ปุ่มส่งข้อมูลเรืองแสง */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-cyan-hover));
            color: #0b0f19;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: 'Kanit', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 240, 255, 0.4);
            margin-top: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 240, 255, 0.7);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background-color: #374151;
            color: var(--text-secondary);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* หน้าจอขอบคุณหลังจากลงทะเบียนสำเร็จ */
        .success-box {
            display: none;
            text-align: center;
            padding: 30px 10px;
        }

        .success-box.active {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        .success-icon {
            font-size: 3.5rem;
            color: var(--neon-cyan);
            margin-bottom: 20px;
            text-shadow: 0 0 15px rgba(0, 240, 255, 0.6);
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .success-box h3 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-primary);
        }

        .success-box p {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        /* อนิเมชัน */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo-badge">MG</div>

        <div class="header-section">
            <h1>M2 <span>MOTORSPORT</span></h1>
            <p>ลงทะเบียนรับข้อเสนอพิเศษสุดเอ็กซ์คลูซีฟกับเราได้เลยค่ะคุณชินอิจิ!</p>
        </div>

        <div class="promo-card">
            
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

            <form id="mgPromoForm" action="https://docs.google.com/forms/d/e/1FAIpQLScKobKc9-lyzRAUgTlOr1h3nga5XhzBAiFSOc6tNMp1LrGE1g/formResponse" method="POST" target="hidden_iframe">
                <h2>กรอกข้อมูลเพื่อติดต่อทีมขาย</h2>
                
                <div class="form-group">
                    <label for="carModel">รุ่นรถที่สนใจ <span>*</span></label>
                    <select id="carModel" name="entry.914069876" required>
                        <option value="" disabled selected>กรุณาเลือกรุ่นรถที่ต้องการ...</option>
                        <option value="MG3 HYBRID">MG3 HYBRID</option>
                        <option value="MG42026 EV">MG42026 EV</option>
                        <option value="MG5 PRO">MG5 PRO</option>
                        <option value="MG ZS">MG ZS</option>
                        <option value="MG URBAN EV">MG URBAN EV</option>
                        <option value="MGS5 EV">MGS5 EV</option>
                        <option value="MGIM5 EV">MGIM5 EV</option>
                        <option value="MGIM6 EV">MGIM6 EV</option>
                        <option value="MG MAXUS7 EV">MG MAXUS7 EV</option>
                        <option value="MG MAXUS9 EV">MG MAXUS9 EV</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nickname">ชื่อเล่นของคุณ <span>*</span></label>
                    <input type="text" id="nickname" name="entry.1609197620" required placeholder="ตัวอย่าง: คุณเอ">
                </div>

                <div class="form-group">
                    <label for="phoneNumber">เบอร์โทรศัพท์ <span>*</span></label>
                    <input type="tel" id="phoneNumber" name="entry.983015044" required pattern="[0-9]{9,10}" placeholder="ตัวอย่าง: 0812345678">
                </div>

                <div class="form-group">
                    <label for="lineId">ID LINE</label>
                    <input type="text" id="lineId" name="entry.305779841" placeholder="(ใช้ส่งข้อมูลเพิ่มเติม)">
                </div>

                <button type="submit" id="submitBtn" class="btn-submit">
                    รับสิทธิ์และข้อเสนอพิเศษ
                </button>
            </form>

            <div id="successMessage" class="success-box">
                <div class="success-icon">✓</div>
                <h3>ลงทะเบียนเรียบร้อยแล้วค่ะ!</h3>
                <p>เราได้รับข้อมูลของคุณเรียบร้อยแล้ว<br>ที่ปรึกษาการขายจะติดต่อกลับเพื่อแจ้งข้อเสนอโดยเร็วที่สุดค่ะ</p>
            </div>

        </div>
    </div>

    <script>
document.getElementById('mgPromoForm').addEventListener('submit', function(e) {
    const submitBtn = document.getElementById('submitBtn');
    const theForm = document.getElementById('mgPromoForm');
    
    submitBtn.disabled = true;
    submitBtn.innerText = 'กำลังส่งข้อมูลเข้าระบบ...';
    
    setTimeout(() => {
        theForm.reset(); 
        submitBtn.disabled = false;
        submitBtn.innerText = 'รับสิทธิ์และข้อเสนอพิเศษ';
        
        theForm.classList.add('hidden');
        document.getElementById('successMessage').classList.add('active');
    }, 1000);
});
    </script>
</body>
</html>
