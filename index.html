<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promotion - M2 MOTORSPORT EVOLUTION</title>
    
    <!-- ฟอนต์ Prompt -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        /* ธีมสีใหม่: ขาว-น้ำเงิน (Clean & Professional) */
        :root {
            --primary-blue: #007bff;       /* สีน้ำเงินหลัก (คล้ายรูป) */
            --primary-hover: #0056b3;      /* สีน้ำเงินเข้มตอน Hover */
            --bg-body: #f3f6f9;            /* พื้นหลังเว็บสีเทาอ่อน */
            --card-bg: #ffffff;            /* พื้นหลังการ์ดสีขาว */
            --input-bg: #ffffff;           /* พื้นหลังช่องกรอก */
            --border-color: #dee2e6;       /* เส้นขอบสีเทาอ่อน */
            --text-main: #212529;          /* ตัวหนังสือสีดำเข้ม */
            --text-muted: #6c757d;         /* ตัวหนังสือสีเทารอง */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            font-family: 'Prompt', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            margin: 20px auto;
        }

        /* โลโก้ MG สี่เหลี่ยมมน พื้นดำ ตัวขาว */
        .logo-badge {
            width: 80px;
            height: 80px;
            background-color: #000000;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 0 auto 15px auto;
            color: #ffffff;
            letter-spacing: -1px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .header-section h1 {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .header-section p {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.5;
            font-weight: 300;
        }

        /* การ์ดฟอร์มสีขาว เงาบางๆ */
        .promo-card {
            background-color: var(--card-bg);
            border-radius: 24px; /* มุมโค้งมากตามรูป */
            padding: 40px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05); /* เงานุ่มนวล */
            border: 1px solid rgba(0,0,0,0.02);
        }

        .promo-card h2 {
            font-size: 1.2rem;
            font-weight: 600;
            text-align: center;
            margin-bottom: 25px;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.95rem;
            color: var(--text-main);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group label span {
            color: #dc3545; /* สีแดงสำหรับเครื่องหมาย * */
        }

        input, select {
            width: 100%;
            padding: 14px 16px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            color: var(--text-main);
            font-size: 1rem;
            font-family: 'Prompt', sans-serif;
            transition: all 0.2s ease;
            box-sizing: border-box;
        }

        select {
            appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%236c757d' height='24' viewBox='0 0 24 24' width='24' xmlns='http://www.w3.org/2000/svg'><path d='M7 10l5 5 5-5z'/></svg>");
            background-repeat: no-repeat;
            background-position: right 14px center;
            padding-right: 40px;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.15); /* Glow สีฟ้าอ่อน */
        }

        input::placeholder {
            color: #adb5bd;
        }

        /* ปุ่มกดส่งแบบเดิม (สีน้ำเงินเต็มบาน) */
        .btn-submit {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-blue);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            font-family: 'Prompt', sans-serif;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0, 123, 255, 0.2);
        }

        .btn-submit:hover {
            background-color: var(--primary-hover);
        }

        .btn-submit:active {
            transform: scale(0.98);
        }

        .btn-submit:disabled {
            background-color: #a0c4e8;
            cursor: not-allowed;
            transform: none;
        }

        /* ส่วนแสดงผลสำเร็จ */
        .success-box {
            display: none;
            text-align: center;
            padding: 30px 10px;
        }

        .success-box.active {
            display: block;
            animation: fadeIn 0.5s ease-out;
        }

        .success-icon {
            font-size: 3.5rem;
            color: var(--primary-blue);
            margin-bottom: 20px;
        }

        .success-box h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        .success-box p {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- โลโก้ MG -->
        <div class="logo-badge">MG</div>

        <div class="header-section">
            <h1>M2 MOTORSPORT</h1>
            <p>ลงทะเบียนรับข้อเสนอพิเศษสุดเอ็กซ์คลูซีฟกับเราได้เลยค่ะ</p>
        </div>

        <div class="promo-card">
            
            <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

            <!-- ฟอร์มเดิม ไม่มีการแก้ชื่อฟิลด์หรือ ID -->
            <form id="mgPromoForm" action="https://docs.google.com/forms/d/e/1FAIpQLScKobKc9-lyzRAUgTlOr1h3nga5XhzBAiFSOc6tNMp1LrGE1g/formResponse" method="POST" target="hidden_iframe">
                <h2>กรอกข้อมูลเพื่อติดต่อทีมขาย</h2>
                
                <div class="form-group">
                    <label for="carModel">รุ่นรถที่สนใจ <span>*</span></label>
                    <select id="carModel" name="entry.914069876" required>
                        <option value="" disabled selected>กรุณาเลือกรุ่นรถที่ต้องการ...</option>
                        <option value="MG3 HYBRID">MG3 HYBRID</option>
                        <option value="MG42026 EV">MG42026 EV</option>
                        <option value="MG5 PRO">MG5 PRO</option>
                        <option value="MG ZS">MG ZS</option>
                        <option value="MG URBAN EV">MG URBAN EV</option>
                        <option value="MGS5 EV">MGS5 EV</option>
                        <option value="MGIM5 EV">MGIM5 EV</option>
                        <option value="MGIM6 EV">MGIM6 EV</option>
                        <option value="MG MAXUS7 EV">MG MAXUS7 EV</option>
                        <option value="MG MAXUS9 EV">MG MAXUS9 EV</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="nickname">ชื่อเล่นของคุณ <span>*</span></label>
                    <input type="text" id="nickname" name="entry.1609197620" required placeholder="ตัวอย่าง: คุณเอ">
                </div>

                <div class="form-group">
                    <label for="phoneNumber">เบอร์โทรศัพท์ <span>*</span></label>
                    <input type="tel" id="phoneNumber" name="entry.983015044" required pattern="[0-9]{9,10}" placeholder="ตัวอย่าง: 0812345678">
                </div>

                <div class="form-group">
                    <label for="lineId">ID LINE</label>
                    <input type="text" id="lineId" name="entry.305779841" placeholder="(ใช้ส่งข้อมูลเพิ่มเติม)">
                </div>

                <!-- ปุ่มกดส่งแบบเดิม -->
                <button type="submit" id="submitBtn" class="btn-submit">
                    รับสิทธิ์และข้อเสนอพิเศษ
                </button>
            </form>

            <div id="successMessage" class="success-box">
                <div class="success-icon">✓</div>
                <h3>ลงทะเบียนเรียบร้อยแล้วค่ะ!</h3>
                <p>เราได้รับข้อมูลของคุณเรียบร้อยแล้ว<br>ที่ปรึกษาการขายจะติดต่อกลับเพื่อแจ้งข้อเสนอโดยเร็วที่สุดค่ะ</p>
            </div>

        </div>
    </div>

    <script>
document.getElementById('mgPromoForm').addEventListener('submit', function(e) {
    const submitBtn = document.getElementById('submitBtn');
    const theForm = document.getElementById('mgPromoForm');
    
    submitBtn.disabled = true;
    submitBtn.innerText = 'กำลังส่งข้อมูลเข้าระบบ...';
    
    setTimeout(() => {
        theForm.reset(); 
        submitBtn.disabled = false;
        // คืนค่าข้อความปุ่มเป็นแบบเดิม
        submitBtn.innerText = 'รับสิทธิ์และข้อเสนอพิเศษ'; 
        
        theForm.classList.add('hidden');
        document.getElementById('successMessage').classList.add('active');
    }, 1000);
});
    </script>
</body>
</html>
